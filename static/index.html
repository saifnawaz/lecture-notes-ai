<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Notes AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Lecture Notes AI</h1>
    <p>Upload a PDF, get notes and a quiz.</p>
  </header>

  <div class="layout">
    <aside>
      <h2>Saved notes</h2>
      <div class="nav-buttons">
        <button id="new-btn" class="secondary">+ New upload</button>
        <button id="progress-btn" class="secondary">Progress</button>
        <button id="review-btn" class="secondary">Daily Revision <span id="due-badge" class="badge" hidden></span></button>
      </div>
      <ul id="notes-list"></ul>
    </aside>

    <main>
      <!-- Upload page -->
      <section id="upload-view" class="card">
        <h2>Upload a PDF</h2>
        <form id="upload-form">
          <label>PDF file
            <input type="file" id="file" accept=".pdf,application/pdf" required>
          </label>
          <label>Subject
            <select id="subject-select">
              <option value="">Let the AI guess</option>
              <option value="__new__">+ New subject...</option>
            </select>
          </label>
          <label id="new-subject-label" hidden>New subject name
            <input type="text" id="new-subject" placeholder="e.g. Discrete Mathematics">
          </label>
          <button type="submit" id="submit-btn">Generate notes</button>
        </form>
        <p id="status"></p>
      </section>

      <!-- Notes + quiz view -->
      <section id="note-view" hidden>
        <div class="card">
          <p id="note-subject" class="subject"></p>
          <h2 id="note-topic"></h2>
          <p id="note-date" class="muted"></p>
          <p id="note-accuracy" class="accuracy" hidden></p>
          <ul id="note-notes" class="notes"></ul>
          <div class="flashcards-line">
            <span id="card-info" class="muted"></span>
            <button id="gen-cards-btn" class="secondary" hidden>Generate flashcards</button>
          </div>
        </div>

        <div class="card">
          <div class="quiz-head">
            <h2>Quiz</h2>
            <span id="score"></span>
          </div>
          <div id="quiz"></div>
          <button id="retry-btn" class="secondary" hidden>Retry quiz</button>
        </div>
      </section>

      <!-- Progress -->
      <section id="progress-view" class="card" hidden>
        <div class="quiz-head">
          <h2>Progress</h2>
          <select id="subject-filter" aria-label="Subject">
            <option value="">All subjects</option>
          </select>
        </div>
        <div id="progress-list"></div>
      </section>

      <!-- Daily Revision (flashcards) -->
      <section id="review-view" class="card" hidden>
        <div class="quiz-head">
          <h2>Daily Revision</h2>
          <label class="inline">Subject
            <select id="review-subject">
              <option value="">All subjects</option>
            </select>
          </label>
        </div>
        <p id="review-count" class="muted"></p>
        <p id="review-feedback" class="feedback" hidden></p>

        <div id="flashcard" class="flashcard" hidden>
          <p id="fc-meta" class="subject"></p>
          <p id="fc-front" class="fc-front"></p>
          <p id="fc-back" class="fc-back" hidden></p>
          <p id="fc-hint" class="muted">Click the card (or press Space) to show the answer.</p>
        </div>

        <div id="review-buttons" class="review-buttons" hidden>
          <button data-quality="1" class="again">Again <small>1</small></button>
          <button data-quality="3" class="hard">Hard <small>2</small></button>
          <button data-quality="4" class="good">Good <small>3</small></button>
          <button data-quality="5" class="easy">Easy <small>4</small></button>
        </div>

        <p id="review-done" class="done" hidden>All done! No cards due right now.</p>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
